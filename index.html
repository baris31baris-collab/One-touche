function refreshEnergy(){

  let restored=1+Math.floor((now-energyData.next)/ENERGY_INTERVAL);

}
let sparkBudget=0;function sparks(x,y,color){if(sparkBudget>=42)return;sparkBudget+=3;for(let i=0;i<3;i++){let e=document.createElement('div'),a=Math.random()*Math.PI*2,r=20+Math.random()*50;e.className='spark';e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--spark',color);e.style.setProperty('--dx',Math.cos(a)*r+'px');e.style.setProperty('--dy',Math.sin(a)*r+'px');board.appendChild(e);setTimeout(()=>e.remove(),750)}}
function start(){board.innerHTML='';balls=[];auras=[];combo=0;used=0;delay=0;state='play';effectClock=0;window.pendingSpecials=[];touchId=0;chains={};awarded=new Set();moves=level<=3?999:level<=8?3:level<=13?2:1;moves=Math.min(6,moves+(level<=3?0:bank));bank=0;$('modal').style.display='none';let th=theme();board.style.background=th?th.color:palette[(level-1)%palette.length];board.classList.toggle('halloween',!!th&&th.name.includes('Cadılar'));board.classList.toggle('christmas',!!th&&th.name.includes('Noel'));$('theme').textContent=th?th.name:tr('color');if(th)th.icons.forEach((ic,i)=>{let e=document.createElement('div');e.className='decor '+(i?'two':'one');e.textContent=ic;board.appendChild(e)});
let sz=size(),n=50+(level-1)*5,r=Math.max(4.5,Math.min(12,sz.h/30)-(level-1)*.12),colors=['#f4d45f','#a7e1fa','#b9a3ff','#fff3d2','#f8a768'];
for(let i=0;i<n;i++){let el=document.createElement('div'),red=level>=5&&i%4===0,c=red?'#ef626a':colors[i%colors.length],x=r+Math.random()*Math.max(1,sz.w-2*r),y=r+Math.random()*Math.max(1,sz.h-2*r),angle=Math.random()*Math.PI*2,speed=((level<=20||n<30)?55:35)+Math.random()*(65+Math.min(level,40)*2.5);for(let j=0;j<120&&balls.some(b=>Math.hypot(b.x-x,b.y-y)<b.r+r+5);j++){x=r+Math.random()*Math.max(1,sz.w-2*r);y=r+Math.random()*Math.max(1,sz.h-2*r)}let special=null;if(i===n-1&&(level<=10||Math.random()<(level<=20?.30:level<=50?.20:.15))){if(level<=5){if(level>=2&&Math.random()<.35)special='gold'}else{let pool=['gold','lion'];if(level>=11)pool.push('bomb');if(level>=16)pool.push('split');if(level>=21)pool.push('magnet');if(level>=12&&Math.random()<.22)special='rainbow';else special=pool[Math.floor(Math.random()*pool.length)]}}if(special)c=specials[special].colors;el.className='ball'+(red?' red':'')+(special?' special '+special:'');el.style.setProperty('--color',c);if(special){el.dataset.icon=specials[special].icon;el.setAttribute('aria-label',specials[special][lang][0])}el.style.width=2*r+'px';el.style.height=2*r+'px';board.appendChild(el);balls.push({el,x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r,c,special})}update();draw();localize();refreshEnergy();save()}
function draw(){balls.forEach(b=>{b.el.style.left=b.x-b.r+'px';b.el.style.top=b.y-b.r+'px'})}
function end(win){state='end';if(win){bank=level<=3?0:Math.min(1,moves+(level%10===0?1:0));failed=0;$('result').textContent=used===1?tr('epic'):tr('win');tone(720,.25);$('detail').textContent=(combo>=3?'🔥 COMBO x'+combo+'! ':'')+tr('carry',bank)+(level%10===0?' '+tr('bonus'):'')}else{failed++;bank=0;if(failed>=5){failed=0}$('result').textContent=tr('lose');tone(170,.3,'triangle');$('detail').textContent=tr('left',balls.length)}save();$('continue').textContent=win?tr('next'):tr('retry');$('modal').style.display='flex';$('continue').onclick=()=>{if(win){level++;start();if([4,9,14].includes(level))showMilestone(level)}else start()}}
function addAura(x,y,owner){let el=document.createElement('div');el.className='aura';board.appendChild(el);auras.push({x,y,maxR:Math.min(size().w,size().h)*.14*(level<=5?1.3:level<=10?1.2:level<=20?1.1:1),r:0,age:0,el,owner})}

function frame(t){sparkBudget=0;let dt=Math.min((t-last)/1000||0,.032);last=t;if(state==='play'){let sz=size();effectClock+=dt;let lions=balls.filter(b=>b.special==='lion');let magnets=balls.filter(b=>b.special==='magnet');let normalCount=balls.length-lions.length-magnets.length;lions.forEach(l=>l.el.classList.add('active'));magnets.forEach(m=>m.el.classList.add('active'));balls.forEach(b=>{if(!b.special&&(level<=20||balls.length<30)){let v=Math.hypot(b.vx,b.vy),floor=normalCount<=3?72:55;if(v>0&&v<floor){b.vx=b.vx/v*floor;b.vy=b.vy/v*floor}}if(b.special!=='lion'&&lions.length&&lions.some(l=>Math.hypot(l.x-b.x,l.y-b.y)<170)){let l=lions.reduce((a,c)=>Math.hypot(c.x-b.x,c.y-b.y)<Math.hypot(a.x-b.x,a.y-b.y)?c:a),dx=b.x-l.x,dy=b.y-l.y,d=Math.hypot(dx,dy);if(d>1){let speed=Math.max(20,Math.hypot(b.vx,b.vy)),turn=Math.min(.13,dt*5),nx=b.vx/speed*(1-turn)+dx/d*turn,ny=b.vy/speed*(1-turn)+dy/d*turn,n=Math.hypot(nx,ny);if(n){b.vx=nx/n*speed;b.vy=ny/n*speed}}}else if(b.special!=='magnet'&&magnets.length){for(let m of magnets){let dx=m.x-b.x,dy=m.y-b.y,d=Math.hypot(dx,dy);if(d>1&&d<310){let speed=Math.max(35,Math.hypot(b.vx,b.vy)),turn=Math.min(.65,dt*(13+12*(1-d/310))),nx=b.vx/speed*(1-turn)+dx/d*turn,ny=b.vy/speed*(1-turn)+dy/d*turn,n=Math.hypot(nx,ny);if(n){b.vx=nx/n*speed;b.vy=ny/n*speed}}}}b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>sz.w-b.r){b.x=sz.w-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}if(b.y>sz.h-b.r){b.y=sz.h-b.r;b.vy=-Math.abs(b.vy)}});for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d<min&&d>.001){let nx=dx/d,ny=dy/d,over=(min-d)/2;a.x-=nx*over;a.y-=ny*over;b.x+=nx*over;b.y+=ny*over;let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){a.vx+=rel*nx;a.vy+=rel*ny;b.vx-=rel*nx;b.vy-=rel*ny}}}
auras=auras.filter(a=>{a.age+=dt;if(a.age>=4){a.el.remove();return false}a.r=a.age<2?a.maxR*(0.18+0.82*Math.sin(Math.PI*a.age/2)**0.7):0;a.el.style.display=a.age<2?'block':'none';a.el.style.width=2*a.r+'px';a.el.style.height=2*a.r+'px';a.el.style.left=a.x-a.r+'px';a.el.style.top=a.y-a.r+'px';return true});
let survivors=[],newAuras=[],rainbowHits=[],frameBellPlayed=false;balls.forEach(b=>{let hit=auras.find(a=>a.age<2&&a.r>0.5&&Math.hypot(b.x-a.x,b.y-a.y)<=a.r+b.r);if(hit){b.el.remove();sparks(b.x,b.y,b.c);newAuras.push({x:b.x,y:b.y,owner:hit.owner,mult:b.special==='bomb'?1.8:1});if(b.special){discovered.add(b.special);localStorage.setItem('threeTouchDiscovered',JSON.stringify([...discovered]));if(b.special==='gold')moves++;if(b.special==='rainbow')rainbowHits.push({owner:hit.owner});if(b.special==='split')newAuras.push({x:Math.min(size().w-10,b.x+45),y:b.y,owner:hit.owner,mult:1});if(!seen.has(b.special)){seen.add(b.special);localStorage.setItem('threeTouchSeen',JSON.stringify([...seen]));(window.pendingSpecials??=[]).push(b.special)}}if(b.special){specialBurst(b.special)}else if(!frameBellPlayed){bell(1050+Math.min(combo,20)*18,.035);frameBellPlayed=true}}else survivors.push(b)});balls=survivors;rainbowHits.forEach(h=>{let choices=balls.filter(b=>!b.special);if(!choices.length)return;let target=choices[Math.floor(Math.random()*choices.length)].c;let remaining=[];balls.forEach(b=>{if(!b.special&&b.c===target){b.el.remove();sparks(b.x,b.y,b.c);newAuras.push({x:b.x,y:b.y,owner:h.owner,mult:1})}else remaining.push(b)});balls=remaining;message('🌈 '+({tr:'RENK PATLAMASI!',en:'COLOR BLAST!',es:'¡EXPLOSIÓN DE COLOR!'}[lang]))});if(newAuras.length){combo+=newAuras.length;if([5,10,25,50,75].some(v=>combo>=v&&combo-newAuras.length<v)){let labels={5:'COOL!',10:'SUPER!',25:'WOW!',50:'AMAZING!',75:'LEGENDARY!'};let threshold=[75,50,25,10,5].find(v=>combo>=v&&combo-newAuras.length<v);message(labels[threshold]+' COMBO x'+combo)}}newAuras.forEach(p=>{chains[p.owner]=(chains[p.owner]||0)+1;if(chains[p.owner]>=75&&!awarded.has(p.owner)){awarded.add(p.owner);moves++;message(tr('comboBonus'));tone(980,.3)}addAura(p.x,p.y,p.owner);if(p.mult&&p.mult>1)auras[auras.length-1].maxR*=p.mult});update();draw();if(window.pendingSpecials?.length){let kind=window.pendingSpecials.shift();showSpecial
